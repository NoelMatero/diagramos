[package]
name = "matcharm-reader"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = ["visit", "full", "printing"] }
# `span-locations` is what lets a `match` report the line it starts on, which
# is how a dispatch is attributed to the routine it sits in (#310). Without it
# every match in a file is indistinguishable from every other.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
